<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Shreemant Acharya, Entry-level DevOps Engineer: AWS, Docker, Kubernetes, Terraform</title>
  <style>
    /* Colors taken from the portfolio screenshot: bg #0f1318, name #c8def6, accent #6a9bf4 */
    text { font-family: 'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; }
    .bar   { font-size: 13px; fill: #8e949a; text-anchor: middle; }
    .small { font-size: 16px; fill: #8e949a; }
    .cmd   { font-size: 17px; fill: #d3d7dc; }
    .prompt{ fill: #6a9bf4; }
    .big1  { font-size: 72px; fill: #c8def6; }
    .big2  { font-size: 72px; fill: #6a9bf4; }
    .stack { font-size: 22px; fill: #d3d7dc; }
    .name-left, .name-right, .intro, .stack, .tagline, .footer {
      opacity: 0;
      animation: rise-in 850ms cubic-bezier(.2,.7,.2,1) forwards;
    }
    .intro { animation-delay: 80ms; }
    .name-left { animation-delay: 180ms; }
    .name-right { animation-delay: 420ms; filter: drop-shadow(0 0 7px #6a9bf455); }
    .stack { animation-delay: 760ms; }
    .tagline { animation-delay: 980ms; }
    .footer { animation-delay: 1180ms; }
    .cursor { animation: blink 1s steps(1,end) infinite; fill: #d3d7dc; }
    .prompt { animation: prompt-glow 2.8s ease-in-out infinite; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(13px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes prompt-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: .62; }
    }
    @media (prefers-reduced-motion: reduce) {
      .name-left, .name-right, .intro, .stack, .tagline, .footer, .cursor, .prompt {
        animation: none !important; opacity: 1; transform: none;
      }
    }
  </style>

  <rect width="1200" height="400" rx="16" fill="#0a1111"/>
  <rect x="10" y="10" width="1180" height="380" rx="14" fill="#0f1318" stroke="#4b5056" stroke-width="1.5"/>
  <line x1="10" y1="56" x2="1190" y2="56" stroke="#4b5056" stroke-width="1.5"/>

  <!-- window buttons + title -->
  <circle cx="38" cy="33" r="6" fill="#8b1212"/>
  <circle cx="60" cy="33" r="6" fill="#8a6a12"/>
  <circle cx="82" cy="33" r="6" fill="#1f9e30"/>
  <text x="600" y="38" class="bar">shreemant@portfolio:~</text>

  <!-- content -->
  <text x="60" y="104" class="cmd intro"><tspan class="prompt">shreemant@portfolio</tspan>:~$ whoami</text>
  <text x="60" y="138" class="small intro">// hello, I'm</text>

  <text x="60"  y="212" class="big1 name-left" textLength="389" lengthAdjust="spacingAndGlyphs">Shreemant</text>
  <text x="492" y="212" class="big2 name-right" textLength="346" lengthAdjust="spacingAndGlyphs">Acharya.</text>

  <text x="60" y="262" class="stack"><tspan class="prompt">&gt;</tspan> AWS • Docker • Kubernetes • Terraform</text>
  <text x="60" y="302" class="small tagline">I build, automate, deploy and manage modern infrastructure using cloud-native technologies.</text>

  <text x="60" y="352" class="cmd footer"><tspan class="prompt">shreemant@portfolio</tspan>:~$ <tspan class="cursor">█</tspan></text>
</svg>
